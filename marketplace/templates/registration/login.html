{% extends "marketplace/base.html" %}

{% block titulo %}Iniciar sesión | CarFit{% endblock %}

{% block contenido %}
  <h1>Iniciar sesión</h1>

  <form method="post">
    {% csrf_token %}

    {% if form.errors %}
      <div class="errores">
        Usuario o contraseña incorrectos.
      </div>
    {% endif %}

    {{ form.as_p }}

    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
