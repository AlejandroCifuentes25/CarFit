{% extends "marketplace/base.html" %}

{% block titulo %}Editar Artículo | CarFit{% endblock %}
{% block ancho %}600px{% endblock %}

{% block contenido %}
<h1>Editar {{ tipo|title }}</h1>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="boton">Guardar cambios</button>
  <a href="{% url 'marketplace:mis_publicaciones' %}" class="enlace" style="margin-left: 10px;">Cancelar</a>
</form>
{% endblock %}
