{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}CarFit{% endblock %}</title>
  <style>
    :root {
      --tinta: #16212e; --tinta-suave: #5a6a7a; --borde: #d8dfe6;
      --acento: #0e6c9b; --acento-suave: #eaf4f9;
      --error: #d14343; --exito: #1c8a5a; --exito-suave: #e6f6ee;
      --pendiente: #b5750a; --pendiente-suave: #fdf1de;
      --fondo: #f1f5f8; --superficie: #fff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--tinta); background: var(--fondo);
      margin: 0; padding: 0 1rem 2rem; line-height: 1.5;
    }
    .envoltorio { max-width: {% block ancho %}640px{% endblock %}; margin: 0 auto; }
    nav.principal {
      max-width: {% block ancho_nav %}640px{% endblock %}; margin: 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; gap: 1.1rem;
      padding: 1.1rem 0; font-size: .9rem;
    }
    nav.principal .marca { font-weight: 800; font-size: 1.05rem; color: var(--tinta); text-decoration: none; }
    nav.principal a { color: var(--tinta-suave); text-decoration: none; font-weight: 600; }
    nav.principal a:hover { color: var(--acento); }
    nav.principal .separador { flex: 1; }
    nav.principal form { margin: 0; }
    nav.principal button.enlace {
      background: none; border: 0; padding: 0; color: var(--tinta-suave);
      font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    nav.principal button.enlace:hover { color: var(--error); }
    main { background: var(--superficie); padding: 2rem;
           border: 1px solid var(--borde); border-radius: 10px; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    h2 { font-size: 1.1rem; }
    .ayuda { color: var(--tinta-suave); font-size: .925rem; }
    label { display: block; font-weight: 600; font-size: .875rem; margin-bottom: .25rem; }
    input, select, textarea {
      width: 100%; padding: .55rem .7rem; border: 1px solid var(--borde);
      border-radius: 6px; font: inherit; background: #fff;
    }
    p { margin: 0 0 1rem; }
    button, .boton {
      background: var(--acento); color: #fff; border: 0; border-radius: 6px;
      padding: .7rem 1.4rem; font: inherit; font-weight: 600; cursor: pointer;
      display: inline-block; text-decoration: none; text-align: center;
    }
    button.secundario, .boton.secundario {
      background: transparent; color: var(--acento); border: 1px solid var(--acento);
    }
    .errores, ul.errorlist {
      background: #fbe9e9; border-left: 3px solid var(--error);
      padding: .75rem 1rem; border-radius: 4px; margin-bottom: 1rem;
      color: #8f2b2b; list-style: none;
    }
    .mensaje { padding: .75rem 1rem; border-radius: 4px; margin-bottom: 1rem;
               border-left: 3px solid var(--acento); font-size: .925rem; }
    .mensaje.success { background: var(--exito-suave); border-color: var(--exito); color: #14523a; }
    .mensaje.error { background: #fbe9e9; border-color: var(--error); color: #8f2b2b; }
    a { color: var(--acento); }

    /* Insignias de estado */
    .badge {
      display: inline-block; padding: .2rem .65rem; border-radius: 99px;
      font-size: .78rem; font-weight: 700; letter-spacing: .02em;
    }
    .badge-APROBADO { background: var(--exito-suave); color: var(--exito); }
    .badge-PENDIENTE { background: var(--pendiente-suave); color: var(--pendiente); }
    .badge-RECHAZADO, .badge-ANULADO { background: #fbe9e9; color: var(--error); }
    .badge-REEMBOLSADO { background: var(--acento-suave); color: var(--acento); }

    /* Catálogo: tarjetas de artículo */
    .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
               gap: 1rem; margin: 1.25rem 0; }
    .tarjeta-articulo { border: 1px solid var(--borde); border-radius: 8px; padding: 1rem;
                         display: flex; flex-direction: column; gap: .4rem; }
    .tarjeta-articulo .precio { font-size: 1.15rem; font-weight: 800; color: var(--tinta); }
    .tarjeta-articulo .etiqueta { font-size: .78rem; color: var(--tinta-suave);
                                   text-transform: uppercase; letter-spacing: .04em; }

    /* Selección de método de pago: tarjetas-radio */
    .metodos { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
               gap: .75rem; margin: .5rem 0 1.25rem; }
    .metodo { position: relative; }
    .metodo input[type="radio"] { position: absolute; opacity: 0; }
    .metodo label.tarjeta-metodo {
      display: block; border: 1.5px solid var(--borde); border-radius: 8px;
      padding: .85rem 1rem; cursor: pointer; font-weight: 700; margin: 0;
      transition: border-color .1s, background .1s;
    }
    .metodo label.tarjeta-metodo .comision {
      display: block; font-weight: 500; font-size: .8rem; color: var(--tinta-suave); margin-top: .2rem;
    }
    .metodo input[type="radio"]:checked + label.tarjeta-metodo {
      border-color: var(--acento); background: var(--acento-suave); color: var(--acento);
    }
    .metodo input[type="radio"]:focus-visible + label.tarjeta-metodo { outline: 2px solid var(--acento); }

    .campos-metodo { display: none; border-top: 1px dashed var(--borde); padding-top: 1rem; margin-top: .25rem; }
    .campos-metodo.activo { display: block; }

    .resumen { background: var(--acento-suave); border-radius: 8px; padding: 1rem 1.1rem;
               margin: 1.25rem 0; font-size: .925rem; }
    .resumen .fila { display: flex; justify-content: space-between; padding: .15rem 0; }
    .resumen .fila.total { font-weight: 800; font-size: 1.05rem; border-top: 1px solid #cfe3ec;
                            margin-top: .4rem; padding-top: .5rem; }

    table.tabla { width: 100%; border-collapse: collapse; font-size: .9rem; }
    table.tabla th, table.tabla td { text-align: left; padding: .6rem .5rem;
                                       border-bottom: 1px solid var(--borde); }
    table.tabla th { color: var(--tinta-suave); font-size: .78rem; text-transform: uppercase; }
    table.tabla tr:hover td { background: #fafcfd; }

    .lista-datos { list-style: none; padding: 0; margin: 0 0 1.25rem; }
    .lista-datos li { display: flex; justify-content: space-between;
                       padding: .5rem 0; border-bottom: 1px solid var(--borde); }
    .lista-datos li:last-child { border-bottom: 0; }
    .lista-datos .clave { color: var(--tinta-suave); }
    .vacio { color: var(--tinta-suave); font-style: italic; padding: 1.5rem 0; text-align: center; }
    {% block estilos %}{% endblock %}
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <nav class="principal">
    <a class="marca" href="{% url 'marketplace:catalogo_compras' %}">CarFit</a>
    <a href="{% url 'marketplace:catalogo_compras' %}">Comprar</a>
    <a href="{% url 'marketplace:crear_articulo' %}">Publicar</a>
    <a href="{% url 'marketplace:historial_pagos' %}">Mis pagos</a>
    <span class="separador"></span>
    <span class="ayuda">{{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="enlace">Salir</button>
    </form>
  </nav>
  {% endif %}
  <div class="envoltorio">
    <main>
      {% if messages %}
        {% for mensaje in messages %}
          <div class="mensaje {{ mensaje.tags }}">{{ mensaje }}</div>
        {% endfor %}
      {% endif %}
      {% block contenido %}{% endblock %}
    </main>
  </div>
</body>
</html>
