{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}CarFit{% endblock %}</title>
  <style>
    :root { --tinta: #16212e; --borde: #d8dfe6; --acento: #0e6c9b; --error: #d14343; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--tinta); background: #f1f5f8;
      margin: 0; padding: 2rem 1rem; line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; background: #fff;
           padding: 2rem; border: 1px solid var(--borde); border-radius: 10px; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .ayuda { color: #5a6a7a; font-size: .925rem; }
    label { display: block; font-weight: 600; font-size: .875rem; margin-bottom: .25rem; }
    input, select, textarea {
      width: 100%; padding: .55rem .7rem; border: 1px solid var(--borde);
      border-radius: 6px; font: inherit; background: #fff;
    }
    p { margin: 0 0 1rem; }
    button {
      background: var(--acento); color: #fff; border: 0; border-radius: 6px;
      padding: .7rem 1.4rem; font: inherit; font-weight: 600; cursor: pointer;
    }
    .errores, ul.errorlist {
      background: #fbe9e9; border-left: 3px solid var(--error);
      padding: .75rem 1rem; border-radius: 4px; margin-bottom: 1rem;
      color: #8f2b2b; list-style: none;
    }
    a { color: var(--acento); }
  </style>
</head>
<body>
  <main>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
