{% extends "base.html" %}

{% block title %}{{ config.title }} | Administración CarFit{% endblock %}

{% block content %}
  <h1>{{ config.title }}</h1>
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    {{ form.as_p()|safe }}
    <button class="button" type="submit">Guardar</button>
    <a href="{{ url_for('admin_resource_list', resource=resource) }}">Cancelar</a>
  </form>
{% endblock %}
