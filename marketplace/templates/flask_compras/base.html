<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block titulo %}CarFit | Compras{% endblock %}</title>
  <style>
    :root { --tinta:#16212e; --suave:#5a6a7a; --borde:#d8dfe6; --acento:#0e6c9b; --error:#b42318; --fondo:#f1f5f8; }
    * { box-sizing:border-box; }
    body { font-family:system-ui,sans-serif; background:var(--fondo); color:var(--tinta); margin:0; }
    nav { background:#fff; border-bottom:1px solid var(--borde); padding:.8rem 1.5rem; display:flex; align-items:center; gap:1.2rem; }
    nav a, a { color:var(--acento); }
    nav .marca { font-weight:800; text-decoration:none; color:var(--tinta); }
    main { max-width:960px; margin:1.5rem auto; padding:1.5rem; background:#fff; border-radius:8px; }
    h1 { margin-top:0; }
    .ayuda { color:var(--suave); }
    .rejilla { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1rem; }
    .tarjeta { border:1px solid var(--borde); border-radius:8px; padding:1rem; display:grid; gap:.55rem; }
    .precio { font-weight:750; font-size:1.1rem; }
    .resumen { border:1px solid var(--borde); border-radius:8px; padding:1rem; margin:1rem 0; }
    .fila { display:flex; justify-content:space-between; gap:1rem; padding:.35rem 0; }
    .total { font-weight:750; border-top:1px solid var(--borde); margin-top:.4rem; padding-top:.75rem; }
    button, .boton { background:var(--acento); border:0; color:white; border-radius:5px; padding:.65rem 1rem; cursor:pointer; text-decoration:none; }
    button.secundario { background:#526273; }
    button:disabled { opacity:.6; cursor:wait; }
    label { display:block; font-weight:600; margin:.7rem 0 .25rem; }
    input, select { max-width:100%; padding:.55rem; border:1px solid var(--borde); border-radius:4px; }
    .metodo { border:1px solid var(--borde); border-radius:6px; padding:.7rem; margin:.4rem 0; }
    .metodo label { display:inline; font-weight:500; margin:0; }
    .errores { color:var(--error); }
    .campo { margin:.75rem 0; }
    .estado { color:var(--suave); font-size:.9rem; }
    @media(max-width:600px) { nav { flex-wrap:wrap; } main { margin:.75rem; padding:1rem; } }
  </style>
</head>
<body>
  <nav>
    <a class="marca" href="{{ prefix }}/catalogo/">CarFit</a>
    <a href="{{ prefix }}/catalogo/">Comprar</a>
    <a href="{{ prefix }}/carrito/">Carrito ({{ carrito.cantidad_producto|default(0) }})</a>
    <a href="/publicaciones/v2/nuevo/">Publicar</a>
    <a href="/pagos/">Mis pagos</a>
    <span class="ayuda">{{ user.username }}</span>
    <button type="button" class="secundario" onclick="CarFitShoppingCart.cerrarSesion(this)">Salir</button>
  </nav>
  <main>
    <div id="mensaje-carrito" class="errores" role="alert"></div>
    {% block contenido %}{% endblock %}
  </main>
  <script>
    (function () {
      function token() {
        var element = document.querySelector('meta[name="csrf-token"]');
        return element ? element.content : "";
      }
      function mensaje(texto) {
        var element = document.getElementById("mensaje-carrito");
        if (element) { element.textContent = texto || ""; }
      }
      function mover(url, button) {
        if (button) { button.disabled = true; }
        fetch(url, {
          method: "POST",
          headers: { "Accept": "application/json", "X-CSRFToken": token() }
        }).then(function (response) {
          return response.json().then(function (body) {
            if (!response.ok) { throw new Error(body.detail || "No se pudo actualizar el carrito."); }
            window.location.reload();
          });
        }).catch(function (error) {
          mensaje(error.message);
          if (button) { button.disabled = false; }
        });
      }
      function cerrarSesion(button) {
        if (button) { button.disabled = true; }
        fetch("/api/v2/logout/", {
          method: "POST",
          headers: { "Accept": "application/json", "X-CSRFToken": token() }
        }).then(function (response) {
          return response.json().then(function (body) {
            if (!response.ok) { throw new Error(body.detail || body.error || "No se pudo cerrar sesión."); }
            window.location.assign("/");
          });
        }).catch(function (error) {
          mensaje(error.message);
          if (button) { button.disabled = false; }
        });
      }
      window.CarFitShoppingCart = { mover: mover, cerrarSesion: cerrarSesion };
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
