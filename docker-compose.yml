services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carfit}
      POSTGRES_USER: ${POSTGRES_USER:-carfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carfit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: carfit.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-carfit}
      POSTGRES_USER: ${POSTGRES_USER:-carfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carfit}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  payments:
    build:
      context: .
      dockerfile: Dockerfile.payments
    environment:
      DJANGO_SETTINGS_MODULE: carfit.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-carfit}
      POSTGRES_USER: ${POSTGRES_USER:-carfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carfit}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PASARELA_PAGO: ${PASARELA_PAGO:-MOCK}
      NOTIFICADOR_PAGOS: ${NOTIFICADOR_PAGOS:-MOCK}
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started
    volumes:
      - media_data:/app/media

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - django
      - payments
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  media_data: