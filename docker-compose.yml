x-broker: &broker
  CELERY_BROKER_URL: redis://redis:6379/0

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["celery", "-A", "carfit", "worker", "--beat", "--loglevel=INFO", "--concurrency=2"]
    environment:
      <<: *broker
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-carfit}
      POSTGRES_USER: ${POSTGRES_USER:-carfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carfit}
      POSTGRES_HOST: db
      NOTIFICADOR: ${NOTIFICADOR:-MOCK}
      NOTIFICADOR_PAGOS: ${NOTIFICADOR_PAGOS:-MOCK}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-responder@carfit.co}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carfit}
      POSTGRES_USER: ${POSTGRES_USER:-carfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carfit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *broker
      DJANGO_SETTINGS_MODULE: carfit.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-carfit}
      POSTGRES_USER: ${POSTGRES_USER:-carfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carfit}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  payments:
    build:
      context: .
      dockerfile: Dockerfile.payments
    environment:
      <<: *broker
      DJANGO_SETTINGS_MODULE: carfit.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-carfit}
      POSTGRES_USER: ${POSTGRES_USER:-carfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carfit}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PASARELA_PAGO: ${PASARELA_PAGO:-MOCK}
      NOTIFICADOR_PAGOS: ${NOTIFICADOR_PAGOS:-MOCK}
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started
    volumes:
      - media_data:/app/media

  accounts:
    build:
      context: .
      dockerfile: Dockerfile.accounts
    environment:
      DJANGO_SETTINGS_MODULE: carfit.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-carfit}
      POSTGRES_USER: ${POSTGRES_USER:-carfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carfit}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started

  publications:
    build:
      context: .
      dockerfile: Dockerfile.publications
    environment:
      <<: *broker
      DJANGO_SETTINGS_MODULE: carfit.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-carfit}
      POSTGRES_USER: ${POSTGRES_USER:-carfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carfit}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started
    volumes:
      - media_data:/app/media

  shopping:
    build:
      context: .
      dockerfile: Dockerfile.shopping
    environment:
      <<: *broker
      DJANGO_SETTINGS_MODULE: carfit.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-carfit}
      POSTGRES_USER: ${POSTGRES_USER:-carfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carfit}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PASARELA_PAGO: ${PASARELA_PAGO:-MOCK}
      NOTIFICADOR_PAGOS: ${NOTIFICADOR_PAGOS:-MOCK}
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - django
      - payments
      - accounts
      - publications
      - shopping
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./marketplace/static/marketplace:/srv/carfit-assets:ro

volumes:
  redis_data:
  postgres_data:
  media_data:
