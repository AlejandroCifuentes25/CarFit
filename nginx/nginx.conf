events {}

http {
    upstream django_app {
        server django:8000;
    }

    upstream payments_app {
        server payments:5001;
    }

    upstream accounts_app {
        server accounts:5002;
    }

    upstream publications_app {
        server publications:5003;
    }

    upstream shopping_app {
        server shopping:5004;
    }

    server {
        listen 80;

        # Strangler route: only the payments capability goes to Flask.
        location /api/v2/pagos {
            proxy_pass http://payments_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Account/authentication API migrated to Flask; Django remains the
        # legacy /api/v1/ implementation and continues serving its HTML pages.
        location /api/v2/ {
            proxy_pass http://accounts_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vehicle/spare-part publishing and management web flows migrated to
        # Flask. The Django pages (/articulos/..., /mis-publicaciones/) remain
        # as legacy/rollback.
        location /publicaciones/v2/ {
            client_max_body_size 20m;
            proxy_pass http://publications_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Catalog and cart web flows migrated to Flask; Django routes remain
        # available as the legacy implementation.
        location /compras/v2/ {
            proxy_pass http://shopping_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Flask-backed admin panel. The original Django admin stays at /admin/.
        location /admin/v2/ {
            proxy_pass http://accounts_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /admin/v2 {
            return 301 /admin/v2/;
        }

        # Legacy API contract. Nginx removes /api/v1/ so existing Django
        # routes under /api/ continue to work without changing their code.
        location /api/v1/ {
            proxy_pass http://django_app/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1 {
            return 301 /api/v1/;
        }

        # HTML, admin, media and any route not yet strangled remain in Django.
        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}